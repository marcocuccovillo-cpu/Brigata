<!DOCTYPE html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#faf6ec"><link rel="manifest" href="manifest.json"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png"><title>Brigata</title>
<style>
:root{--bg:#faf6ec;--c:#fffdf7;--t:#14120e;--m:#6f6753;--p:#14120e;--a:#8a6a1c;--g:#c9a24a;--r:#b3261e;--b:#e6dcc3}
*{box-sizing:border-box}body{margin:0;font:16px system-ui,sans-serif;background:var(--bg);color:var(--t);padding:0 0 20px 66px}
header{display:flex;align-items:center;gap:10px;height:64px;padding:0 16px;margin-left:-66px;position:sticky;top:0;z-index:2;background:var(--bg);border-bottom:2px solid var(--g)}
main{padding:0 12px 12px;max-width:640px;margin:auto}
.card{background:var(--c);border:1px solid var(--b);border-radius:14px;padding:14px;margin-bottom:12px;box-shadow:0 1px 3px rgba(20,18,14,.06)}
.row{display:flex;gap:8px;align-items:center;justify-content:space-between}
.m{color:var(--m);font-size:13px}
button{font:inherit;border:1px solid var(--p);border-radius:8px;padding:10px 14px;background:var(--p);color:#e8c872;border-color:var(--g)}
button.g{background:transparent;color:var(--t);border-color:var(--g)}button.g.d{color:var(--r);border-color:var(--r)}
input,select,textarea{font:inherit;width:100%;padding:10px;border:1px solid var(--b);border-radius:8px;background:var(--c);color:var(--t);margin:4px 0}
.tag{display:inline-block;background:#f3e8c8;color:#5c4710;border-radius:20px;padding:2px 9px;font-size:12px;margin:4px 4px 0 0}
.bad{color:var(--r);font-weight:700}.ok{color:var(--t);font-weight:700}.warn{color:var(--a);font-weight:700}
nav{position:fixed;top:64px;bottom:0;left:0;width:66px;display:flex;flex-direction:column;overflow-y:auto;overflow-x:hidden;scrollbar-width:none;background:var(--c);border-right:1px solid var(--g);padding:8px 2px calc(8px + env(safe-area-inset-bottom));z-index:3}
nav button{flex:0 0 auto;width:100%;background:none;border:0;color:var(--m);border-radius:0;padding:9px 1px;font-size:10.5px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:4px}nav button.on{color:var(--t)}nav button .lb{white-space:nowrap}
dialog{border:0;border-radius:12px;width:min(94vw,560px);max-height:90vh;background:var(--c);color:var(--t);padding:16px}
.chk{display:inline-flex;gap:5px;align-items:center;margin:4px 10px 4px 0;font-size:14px}.chk input{width:auto;margin:0}
table{width:100%;border-collapse:collapse;font-size:13px}td,th{border-bottom:1px solid var(--b);padding:5px 3px;text-align:left}
@media print{nav,header,button,.np{display:none}body{background:#fff;color:#000}}
.bn{font:700 24px/1 Georgia,serif;letter-spacing:.5px;display:flex;flex-direction:column}.bn small{font:italic 12px Georgia,serif;color:var(--a);margin-top:3px;letter-spacing:0}
.pt{font:700 22px Georgia,serif;margin:14px 2px 12px}
.ic{display:flex;padding:4px 10px;border-radius:14px}nav button.on .ic{background:#f1e3b9}
input:focus,select:focus,textarea:focus{outline:2px solid var(--g)}
.bb{display:flex;gap:10px;overflow-x:auto;padding:4px 2px 14px;scroll-snap-type:x proximity}
.tile{flex:0 0 140px;height:190px;border-radius:14px;padding:12px;display:flex;flex-direction:column;justify-content:space-between;scroll-snap-align:start;border:1px solid var(--b);background:var(--c);box-shadow:0 1px 3px rgba(20,18,14,.08);overflow:hidden}
.tile.tv{background:var(--p);color:#faf6ec;border-color:var(--g)}.tile.nt{border-top:3px solid var(--g)}
.tile.add{border:1.5px dashed var(--g);align-items:center;justify-content:center;font-size:34px;color:var(--a);background:transparent;box-shadow:none}.tile.add span{font-size:13px}
.tg{font-size:12px;color:var(--g);font-weight:700;text-transform:uppercase;letter-spacing:.4px}.nt .tg{color:var(--a)}
.big{font:700 34px Georgia,serif;line-height:1.1}.big small{font:13px system-ui}
.tn,.tx{font-size:14px;margin-top:6px;display:-webkit-box;-webkit-box-orient:vertical;overflow:hidden;-webkit-line-clamp:2}.tx{-webkit-line-clamp:7}
.al{background:var(--g);color:#14120e;border-radius:8px;padding:4px 6px;font-size:11px;font-weight:700;margin-bottom:4px}.m2{font-size:12px;opacity:.8;margin-bottom:4px}
.fg{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.fc{background:var(--c);border:1px solid var(--b);border-radius:14px;padding:10px;text-align:center}.fc svg{width:100%;height:130px}
nav::-webkit-scrollbar{display:none}
.tl{display:flex;gap:10px;overflow-x:auto;margin:0 -12px 8px;padding:2px 12px 10px;scroll-snap-type:x proximity;scrollbar-width:none}
.t{flex:0 0 138px;height:188px;border:1px solid var(--b);border-radius:14px;background:var(--c);box-shadow:0 1px 3px rgba(20,18,14,.08);display:flex;flex-direction:column;overflow:hidden;scroll-snap-align:start;cursor:pointer}
.t .h{background:var(--p);color:#e8c872;padding:8px 10px;font:700 11px system-ui;text-transform:uppercase;letter-spacing:.6px}
.t .dn{font:700 30px/1.1 Georgia,serif;letter-spacing:0}.t .b{padding:8px 10px;font-size:13px;flex:1;overflow:hidden}
.t.n .h{text-transform:none;font-size:13px}.t.imp .h{background:var(--g);color:var(--p)}
.sc{margin-top:6px;background:#f3e8c8;color:#5c4710;border:1px solid var(--g);border-radius:8px;padding:3px 6px;font-size:11px;font-weight:700}
.clamp{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.sg{display:flex;background:var(--b);border-radius:12px;padding:3px;margin-bottom:12px}.sg button{flex:1;background:none;border:0;color:var(--m);padding:9px 4px;border-radius:10px;font-weight:600}.sg button.on{background:var(--c);color:var(--t);box-shadow:0 1px 2px rgba(20,18,14,.15)}
@media print{.sg{display:none}}
@media print{body{padding:0}}
.tl.sm .t{flex-basis:112px;height:152px;border-radius:12px}.tl.sm .t .h{font-size:10px;padding:6px 8px}.tl.sm .t .dn{font-size:24px}.tl.sm .t .b{padding:6px 8px;font-size:11.5px}.tl.sm .sc{font-size:10px;padding:2px 5px}
.tt{width:100%;border-collapse:separate;border-spacing:2px;table-layout:fixed;text-align:center;font-size:11px}
.tt th{font-weight:600;color:var(--m);padding:2px 0;line-height:1.25}.tt th.tdy{color:var(--t);box-shadow:inset 0 -2px 0 var(--g)}
.tt td{padding:0}.tt td.tnm{text-align:left;font-size:12px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding-right:4px;cursor:pointer}
.tt td.txc{background:repeating-linear-gradient(135deg,var(--b) 0 4px,transparent 4px 8px);border-radius:7px}
.tc{display:flex;align-items:center;justify-content:center;height:30px;border-radius:7px;font-weight:700;font-size:12px;cursor:pointer;border:1px dashed var(--b)}
.sP{background:#f1e3b9;color:#5c4710;border:0}.sC{background:#14120e;color:#e8c872;border:0}.sD{background:#c9a24a;color:#14120e;border:0}.sR{border:1px dashed var(--m);color:var(--m)}.sF{background:#e6dcc3;color:#6f6753;border:0}
.tc.tx{opacity:.4;text-decoration:line-through}.tcl{font-style:normal;font-size:9px;color:var(--r);font-weight:700}.tw{width:100%;border-collapse:separate;border-spacing:4px 3px}.tw td{padding:0}
.tw-row{display:flex;gap:10px;padding:10px;border-radius:12px;background:var(--c);border:1px solid var(--b);margin-bottom:8px;cursor:pointer}
.tw-row.tdy{border-color:var(--g);box-shadow:0 0 0 1px var(--g)}.tw-row.off{opacity:.75}
.tw-d{flex:0 0 38px;text-align:center;font-size:11px;color:var(--m);text-transform:uppercase}.tw-d b{display:block;font:700 22px/1.1 Georgia,serif;color:var(--t)}
.tw-r{flex:1;min-width:0}.tw-s{display:flex;gap:6px;align-items:flex-start;margin-bottom:3px}
.tw-s i{font-style:normal;font-size:10px;font-weight:700;color:var(--a);text-transform:uppercase;letter-spacing:.4px;flex:0 0 44px;padding-top:4px}
.tw-c{display:inline-block;background:#f1e3b9;color:#5c4710;border-radius:999px;padding:2px 9px;font-size:12px;margin:0 4px 3px 0;font-weight:600}.tw-c.c{background:#14120e;color:#e8c872}
.tw-x{display:inline-block;background:repeating-linear-gradient(135deg,var(--b) 0 4px,transparent 4px 8px);border-radius:6px;padding:2px 10px;font-size:11px;color:var(--m)}
.tw-wc{flex:1;text-align:center;border-radius:8px;font-size:10px;color:var(--m);cursor:pointer;padding:2px 0}.tw-wc b{display:block;font-size:13px;color:var(--t)}.tw-wc.tdy b{box-shadow:inset 0 -2px 0 var(--g)}
.tw-k{margin-top:3px;height:26px;display:flex;align-items:center;justify-content:center;border-radius:6px;font-weight:700;font-size:11px;border:1px dashed var(--b)}
.tw-k.sP,.tw-k.sC,.tw-k.sD,.tw-k.sF{border:0}.tw-k.xc{border:0;background:repeating-linear-gradient(135deg,var(--b) 0 4px,transparent 4px 8px)}
button:disabled{opacity:.35}
.gr{display:grid;grid-template-columns:14px repeat(7,minmax(0,1fr));gap:2px;margin:0 -12px 6px}.gr>div{min-width:0}
.gr-th{text-align:center;font-size:10px;color:var(--m);line-height:1.2;padding:2px 0;cursor:pointer;text-transform:uppercase}.gr-th b{display:block;font-size:15px;color:var(--t);font-family:Georgia,serif}
.gr-th.tdy b{box-shadow:inset 0 -2px 0 var(--g)}.gr-th.off{opacity:.45}
.gr-bl{writing-mode:vertical-rl;transform:rotate(180deg);font-size:9px;font-weight:700;letter-spacing:.7px;text-transform:uppercase;color:var(--a);display:flex;align-items:center;justify-content:center}
.gr-c{min-height:54px;border-radius:8px;border:1px solid var(--b);background:var(--c);padding:2px 1px;cursor:pointer;overflow:hidden}.gr-c:empty{background:transparent;border:1px dashed var(--b)}
.gr-c.x{border:0;background:repeating-linear-gradient(135deg,var(--b) 0 4px,transparent 4px 8px);cursor:default}
.gr-n{display:block;font-size:9px;letter-spacing:-.2px;font-weight:600;border-radius:5px;padding:1px 2px;margin-bottom:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;background:#f1e3b9;color:#5c4710}
.gr-n.c{background:#14120e;color:#e8c872}.gr-n.r{background:transparent;border:1px dashed var(--m);color:var(--m)}.gr-n.f{background:#e6dcc3;color:#6f6753}
</style></head><body><header></header><main></main><nav></nav><dialog id="d"></dialog><input type="file" id="f" accept=".json" hidden>
<script>
const AL=['Glutine','Crostacei','Uova','Pesce','Arachidi','Soia','Latte','Frutta a guscio','Sedano','Senape','Sesamo','Solfiti','Lupini','Molluschi'];
const PRE={
'Ristorante':{u:[['Frigo cucina',0,4],['Frigo carni',0,4],['Frigo pesce',-1,2],['Freezer',-25,-18]],t:['Pulizia piani e taglieri','Sanificazione attrezzature','Pulizia pavimenti','Controllo scadenze e rotazione','Pulizia cappa e friggitrice']},
'Bar':{u:[['Frigo latticini',0,4],['Banco frigo',0,4],['Freezer',-25,-18]],t:['Pulizia macchina caffè','Pulizia banco','Sanificazione frullatori','Controllo scadenze','Pulizia servizi']},
'Pasticceria':{u:[['Frigo creme',0,4],['Vetrina refrigerata',0,4],['Freezer',-25,-18]],t:['Sanificazione piani e impastatrici','Pulizia forni','Controllo scadenze e lotti','Pulizia laboratorio','Controllo infestanti']},
'Gastronomia':{u:[['Frigo',0,4],['Banco caldo',65,90],['Freezer',-25,-18]],t:['Sanificazione piani','Pulizia gastronorm e carrelli','Controllo scadenze','Etichettatura prodotti','Pulizia pavimenti']},
'Hotel e mensa':{u:[['Frigo',0,4],['Freezer',-25,-18],['Buffet freddo',0,10],['Buffet caldo',60,90]],t:['Sanificazione cucina','Pulizia buffet','Controllo scadenze','Pulizia pavimenti','Campioni pasto']}};
let S;try{S=JSON.parse(localStorage.getItem('cp'))}catch(e){}
S=S||{loc:'',ing:[],rec:[],u:[],t:[],log:[],done:{}};
const save=()=>{try{localStorage.setItem('cp',JSON.stringify(S))}catch(e){}};
const $=s=>document.querySelector(s),uid=()=>Math.random().toString(36).slice(2,9);
const eur=n=>n.toLocaleString('it-IT',{style:'currency',currency:'EUR'});
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const today=()=>new Date().toLocaleDateString('sv'),hm=()=>new Date().toLocaleTimeString('it',{hour:'2-digit',minute:'2-digit'});
const ig=id=>S.ing.find(x=>x.id==id);
const cost=r=>r.items.reduce((s,x)=>{const i=ig(x.i);return i?s+(i.u=='pz'?x.q*i.p:x.q/1000*i.p):s},0);
const als=r=>[...new Set(r.items.flatMap(x=>(ig(x.i)||{al:[]}).al))].sort((a,b)=>a-b);
const tags=a=>a.map(k=>`<span class=tag>${AL[k]}</span>`).join('');
const v=(d,n)=>d.querySelector(`[name=${n}]`).value;
let tab='pro';S.lots=S.lots||[];S.pren=S.pren||[];S.fr=S.fr||[];S.pr=S.pr||[];S.sp=S.sp||[];S.nt=S.nt||[];S.tv=S.tv||[];S.st=S.st||[];S.sh=S.sh||{};S.cl=S.cl||[];S.cw=S.cw||[];S.mag=S.mag||{f:[],shop:[],cu:[]};S.bach=S.bach||[];const days=d=>Math.round((new Date(d)-new Date(today()))/864e5);
function ed(t,h,ok){const d=$('#d');d.innerHTML=`<h3 style="margin-top:0">${t}</h3>${h}<div class=row style="margin-top:12px"><button class=g type=button id=x>Annulla</button><button type=button id=s>Salva</button></div>`;if(!d.open)d.showModal();$('#x').onclick=()=>d.close();$('#s').onclick=()=>{if(ok(d)!==false){d.close();save();draw()}}}
function eIng(id){const n=!id,i=ig(id)||{id:uid(),n:'',p:0,u:'kg',al:[],f:''};
ed(n?'Nuovo ingrediente':'Ingrediente',`<input name=n placeholder="Nome" value="${esc(i.n)}"><div class=row><input name=p type=number step=0.01 placeholder="Prezzo €" value="${i.p||''}"><select name=u>${['kg','l','pz'].map(u=>`<option ${u==i.u?'selected':''}>${u}</option>`).join('')}</select></div><input name=f placeholder="Fornitore" value="${esc(i.f)}"><div class=m>Allergeni presenti</div>${AL.map((a,k)=>`<label class=chk><input type=checkbox value=${k} ${i.al.includes(k)?'checked':''}>${a}</label>`).join('')}`,d=>{if(!v(d,'n').trim())return false;Object.assign(i,{n:v(d,'n').trim(),p:+v(d,'p')||0,u:v(d,'u'),f:v(d,'f'),al:[...d.querySelectorAll('.chk input:checked')].map(c=>+c.value)});if(n)S.ing.push(i)})}
function eRec(id){if(!S.ing.length)return alert('Aggiungi prima almeno un ingrediente.');const n=!id,r=S.rec.find(x=>x.id==id)||{id:uid(),n:'',s:1,fc:30,pv:0,items:[]};
const row=x=>`<div class="row it"><select>${S.ing.map(i=>`<option value=${i.id} ${i.id==x.i?'selected':''}>${esc(i.n)} (${i.u=='pz'?'pz':i.u=='kg'?'g':'ml'})</option>`).join('')}</select><input type=number step=any placeholder="Qtà" value="${x.q||''}" style="width:90px"></div>`;
ed(n?'Nuova ricetta':'Ricetta',`<input name=n placeholder="Nome piatto" value="${esc(r.n)}"><div class=row><input name=s type=number min=1 placeholder="Porzioni" value="${r.s}"><input name=fc type=number placeholder="Food cost target %" value="${r.fc}"></div><input name=pv type=number step=0.01 placeholder="Prezzo di vendita € (facoltativo)" value="${r.pv||''}"><div class=m>Ingredienti: quantità totale della ricetta (g, ml o pezzi)</div><div id=its>${r.items.map(row).join('')}</div><button type=button class=g id=ad>+ Ingrediente</button>`,d=>{if(!v(d,'n').trim())return false;Object.assign(r,{n:v(d,'n').trim(),s:Math.max(1,+v(d,'s')||1),fc:+v(d,'fc')||30,pv:+v(d,'pv')||0,items:[...d.querySelectorAll('.it')].map(e=>({i:e.querySelector('select').value,q:+e.querySelector('input').value||0})).filter(x=>x.q>0)});if(n)S.rec.push(r)});
$('#ad').onclick=()=>$('#its').insertAdjacentHTML('beforeend',row({}));if(!r.items.length)$('#ad').click()}
function eTemp(id){const u=S.u.find(x=>x.id==id);ed(esc(u.n),`<input name=t type=number step=0.1 placeholder="Temperatura °C (ammessi ${u.a} / ${u.b})"><input name=note placeholder="Azione correttiva (se fuori range)">`,d=>{const t=parseFloat(v(d,'t'));if(isNaN(t))return false;const ok=t>=u.a&&t<=u.b;if(!ok&&!v(d,'note').trim()){alert('Fuori range: indica l\'azione correttiva.');return false}S.log.push({u:u.id,n:u.n,t,ok,note:v(d,'note'),d:today(),h:hm()});S.log=S.log.slice(-1000)})}
const nUnit=()=>ed('Nuova zona',`<input name=n placeholder="Nome (es. Frigo verdure)"><div class=row><input name=a type=number placeholder="Min °C"><input name=b type=number placeholder="Max °C"></div>`,d=>{if(!v(d,'n').trim()||v(d,'a')===''||v(d,'b')==='')return false;S.u.push({id:uid(),n:v(d,'n').trim(),a:+v(d,'a'),b:+v(d,'b')})});
const nLot=()=>ed('Nuovo lotto',`<input name=n placeholder="Prodotto"><input name=l placeholder="Lotto / fornitore"><div class=m>Scadenza</div><input name=e type=date>`,d=>{if(!v(d,'n').trim()||!v(d,'e'))return false;S.lots.push({id:uid(),n:v(d,'n').trim(),l:v(d,'l'),e:v(d,'e')})});
const nTask=()=>ed('Nuovo compito di pulizia',`<input name=n placeholder="Compito">`,d=>{if(!v(d,'n').trim())return false;S.t.push({id:uid(),n:v(d,'n').trim()})});
function vI(){return `<button data-a=ni style="width:100%;margin-bottom:10px">+ Nuovo ingrediente</button>`+([...S.ing].sort((a,b)=>a.n.localeCompare(b.n)).map(i=>`<div class=card><div class=row><b>${esc(i.n)}</b><span>${eur(i.p)}/${i.u}</span></div><div class=m>${esc(i.f)}</div>${tags(i.al)}<div class=row style="margin-top:8px"><button class=g data-a=ei data-id=${i.id}>Modifica</button><button class="g d" data-a=di data-id=${i.id}>Elimina</button></div></div>`).join('')||'<div class=m>Inizia dagli ingredienti: prezzo e allergeni alimentano tutto il resto.</div>')}
function vR(){return `<button data-a=nr style="width:100%;margin-bottom:10px">+ Nuova ricetta</button>`+(S.rec.map(r=>{const c=cost(r),cp=c/r.s,sug=cp/(r.fc/100),fr=r.pv?cp/r.pv*100:0;return `<div class=card><div class=row><b>${esc(r.n)}</b><span class=m>${r.s} porz.</span></div><div class=m>Costo ricetta ${eur(c)} · per porzione <b>${eur(cp)}</b></div><div>Prezzo consigliato (food cost ${r.fc}%): <b>${eur(sug)}</b></div>${r.pv?`<div class="${fr>r.fc?'bad':'ok'}">Food cost reale ${fr.toFixed(1)}% · margine ${eur(r.pv-cp)}</div>`:''}${tags(als(r))}<div class=row style="margin-top:8px"><button class=g data-a=er data-id=${r.id}>Modifica</button><button class="g d" data-a=dr data-id=${r.id}>Elimina</button></div></div>`}).join('')||'<div class=m>Crea una ricetta: costo e allergeni si calcolano da soli.</div>')}
function vM(){return `<div class="card np"><div class=m>Tabella allergeni (Reg. UE 1169/2011) calcolata dagli ingredienti. Verifica sempre le etichette dei prodotti.</div><div class=row style="margin-top:8px"><button data-a=print>Stampa / PDF</button><button class=g data-a=share>Condividi testo</button></div></div>`+(S.logo?`<img src="${S.logo}" alt="" style="height:64px">`:'')+(S.loc?`<h2>${esc(S.loc)}</h2>`:'')+(S.rec.map(r=>{const a=als(r);return `<div class=card><b>${esc(r.n)}</b><div>${a.length?tags(a):'<span class=ok>Nessun allergene dichiarato</span>'}</div></div>`}).join('')||'<div class=m>Nessun piatto: aggiungi le ricette.</div>')}
function vH(){const D=today(),L=[...S.log].reverse();return `${vPr()}<div class=card><b>Temperature</b>${S.u.map(u=>{const l=L.find(x=>x.u==u.id);return `<div class=row style="margin-top:8px"><div>${esc(u.n)}<div class=m>${u.a}° / ${u.b}°${l?` · ultima <span class="${l.ok?'':'bad'}">${l.t}°</span> ${l.d.slice(5)} ${l.h}`:''}</div></div><div class=row><button data-a=temp data-id=${u.id}>Registra</button><button class="g d" data-a=du data-id=${u.id}>✕</button></div></div>`}).join('')||'<div class=m>Nessuna zona: aggiungila o carica un profilo in Altro.</div>'}<button class=g data-a=nu style="margin-top:10px">+ Zona</button></div>
